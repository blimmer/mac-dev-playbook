---
- name: Install ASDF plugins
  command: "asdf plugin add {{ item }}"
  args:
    creates: "{{ ansible_facts.env.HOME }}/.asdf/plugins/{{ item }}"
  loop: "{{ asdf_plugins }}"
  register: plugin_install
  changed_when: plugin_install.rc == 0
  failed_when: plugin_install.rc != 0 and 'already added' not in plugin_install.stderr
