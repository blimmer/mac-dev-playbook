---
downloads: ~/.ansible-downloads/

configure_dock: true
configure_terminal: false
configure_osx: true
configure_oh_my_zsh: true

configure_iterm: true
configure_asdf: true
configure_claude: true

claude_config_repo: git@github.com:blimmer/claude-config.git
claude_config_repo_version: main
claude_config_local_destination: ~/.claude

uv_tools:
  - nah

dotfiles_repo: https://github.com/blimmer/dotfiles
dotfiles_repo_version: main
dotfiles_repo_accept_hostkey: false
dotfiles_repo_local_destination: ~/.dotfiles
dotfiles_files:
  - .asdfrc
  - .gitconfig
  - .gitignore_global
  - .osx
  - .tool-versions
  - .zshrc

homebrew_installed_packages:
  - ack
  - actionlint
  - asdf
  - awscli
  - bash
  - bat
  - bats-core
  - circleci
  - contextbridge/tap/aether
  - coreutils
  - curl
  - fd
  - ffmpeg
  - findutils
  - gemini-cli
  - gh
  - git
  - git-crypt
  - git-lfs
  - gitleaks
  - gitui
  - go
  - gpg
  - hadolint
  - highlight
  - hyperfine
  - imagemagick
  - jj
  - jq
  - lefthook
  - make
  - mermaid-cli
  - mkcert
  - ocrmypdf
  - openssl
  - pandoc
  - pinact
  - pipx
  - pngcrush
  - pre-commit
  - python3
  - rclone
  - readline
  - rsync
  - ruby-build
  - s3cmd
  - sccache
  - shellcheck
  - ssh-copy-id
  - tfenv
  - the_silver_searcher
  - tlrc
  - tree
  - typescript-language-server
  - typos-cli
  - uv
  - vim
  - wget
  - yamllint
  - yq
  - zizmor
  - zsh

homebrew_taps:
  - contextbridge/tap

homebrew_cask_appdir: /Applications
homebrew_cask_apps:
  - 1password
  - 1password-cli
  - antigravity-cli
  - aws-vault-binary
  - brave-browser
  - chatgpt
  - claude
  - codex
  - contextbridge/tap/cli@alpha
  - cursor
  - docker-desktop
  - firefox@beta
  - font-menlo-for-powerline
  - gcloud-cli
  - github
  - google-chrome
  - imageoptim
  - istat-menus
  - iterm2
  - keepingyouawake
  - logi-options+
  - loom
  - netnewswire
  - obsidian
  - pastebot
  - rectangle
  - session-manager-plugin
  - slack
  - spotify
  - tailscale-app
  - warp
  - zed
  - zoom

asdf_plugins:
  - nodejs
  - ruby
  - terraform
  - bun
  - python
  - just

dockitems_remove:
  - Launchpad
  - Mail
  - Safari
  - Contacts
  - Notes
  - Reminders
  - Maps
  - Photos
  - Messages
  - FaceTime
  - Music
  - Podcasts
  - TV
  - News
  - App Store
  - System Preferences
  - Calendar
  - Freeform

dockitems_persist:
  - name: Firefox
    path: "/Applications/Firefox.app"
    pos: 1
  - name: Messages
    path: "/System/Applications/Messages.app"
    pos: 2
  - name: Zed
    path: "/Applications/Zed.app"
    pos: 3
  - name: Slack
    path: "/Applications/Slack.app"
    pos: 4
  - name: Spotify
    path: "/Applications/Spotify.app"
    pos: 5
  - name: NetNewsWire
    path: "/Applications/NetNewsWire.app"
    pos: 6
  - name: Claude
    path: "/Applications/Claude.app"
    pos: 7
  - name: ChatGPT
    path: "/Applications/ChatGPT.app"
    pos: 8
  - name: Warp
    path: "/Applications/Warp.app"
    pos: 9
  - name: iTerm
    path: "/Applications/iTerm.app"
    pos: 10
