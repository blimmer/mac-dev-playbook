---
downloads: ~/.ansible-downloads/

configure_dock: true
configure_terminal: false
configure_osx: true
configure_oh_my_zsh: true

configure_iterm: true

dotfiles_repo: https://github.com/blimmer/dotfiles
dotfiles_repo_version: main
dotfiles_repo_accept_hostkey: false
dotfiles_repo_local_destination: ~/.dotfiles
dotfiles_files:
  - .asdfrc
  - .gitconfig
  - .gitignore_global
  - .osx
  - .tool-versions
  - .zshrc

homebrew_installed_packages:
  - ack
  - asdf
  - awscli
  - bat
  - coreutils
  - curl
  - ffmpeg
  - git
  - go
  - gpg
  - hadolint
  - highlight
  - jq
  - sqlite
  - openssl
  - pinentry
  - python3
  - ssh-copy-id
  - readline
  - ruby-build
  - s3cmd
  - saml2aws
  - tfenv
  - the_silver_searcher
  - tldr
  - tree
  - vim
  - wget
  - yarn
  - zsh

homebrew_taps:
  - homebrew/core
  - homebrew/cask
  - homebrew/cask-fonts
  - homebrew/cask-versions
  - homebrew/services

homebrew_cask_appdir: /Applications
homebrew_cask_apps:
  - 1password
  - aws-vault
  - docker
  - firefox-beta
  - font-menlo-for-powerline
  - google-chrome
  - graphiql
  - imageoptim
  - istat-menus
  - iterm2
  - keepingyouawake
  - obsidian
  - pastebot
  - rectangle
  - slack
  - spotify
  - stretchly
  - visual-studio-code

dockitems_remove:
  - Launchpad
  - Mail
  - Safari
  - Contacts
  - Notes
  - Reminders
  - Maps
  - Photos
  - Messages
  - FaceTime
  - Music
  - Podcasts
  - TV
  - News
  - App Store
  - System Preferences
  - Calendar

dockitems_persist:
  - name: Firefox
    path: "/Applications/Firefox.app"
    pos: 1
  - name: Google Chrome
    path: "/Applications/Google Chrome.app"
    pos: 2
  - name: Spotify
    path: "/Applications/Spotify.app"
    pos: 3
  - name: Messages
    path: "/System/Applications/Messages.app"
    pos: 4
  - name: Slack
    path: "/Applications/Slack.app"
    pos: 5
  - name: iTerm
    path: "/Applications/iTerm.app"
    pos: 6
